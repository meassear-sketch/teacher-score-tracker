<!doctype html>
<html lang="km" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher Score Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1c1f3a;--muted:#6b7092;--border:#e2e5f2;--primary:#5145e0;--green:#1b9a5e;--green-bg:#e2f7ec;--amber:#b8680a;--amber-bg:#fff3d9;--red:#d33a4b;--red-bg:#fde6e9;--shadow:0 6px 22px rgba(30,30,90,.07)}
[data-theme=dark]{--bg:#11132a;--card:#1b1e3c;--text:#e8eaf8;--muted:#9aa0c9;--border:#2b3060;--green-bg:#133d2b;--amber-bg:#3d2f13;--red-bg:#3f1821;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Khmer",system-ui,sans-serif;font-size:15px;line-height:1.5}
body.km,body.km *{font-family:"Noto Sans Khmer",Inter,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
header{background:linear-gradient(120deg,#4a3ad6,#6d5ff2);color:#fff;border-radius:16px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;opacity:.85;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn.primary{background:var(--primary);color:#fff}
.btn.green{background:#2fa873;color:#fff}
.btn.dark{background:#1d2140;color:#fff}
.btn.gold{background:#f2b93b;color:#222}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:5px 9px;font-size:13px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.stat{padding:16px 18px}
.stat .num{font-size:30px;font-weight:700}
.stat .lbl{font-size:14px;color:var(--muted)}
.stat.g{background:var(--green-bg);border-color:transparent}.stat.g .num{color:var(--green)}
.stat.a{background:var(--amber-bg);border-color:transparent}.stat.a .num{color:var(--amber)}
.stat.r{background:var(--red-bg);border-color:transparent}.stat.r .num{color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--primary);color:#fff;border-color:transparent}
.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--border);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;font-size:14px}
th{background:var(--bg);font-size:13px;color:var(--muted)}
td.idx{color:var(--muted);width:44px}
.code{font-family:ui-monospace,monospace;font-size:12px;background:#ecebff;color:#4130c8;border-radius:8px;padding:3px 8px;display:inline-block}
[data-theme=dark] .code{background:#2a2a5a;color:#c3bfff}
.pill{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ontime{background:var(--green-bg);color:var(--green)}
.pill.late{background:var(--amber-bg);color:var(--amber)}
.pill.notsub{background:var(--red-bg);color:var(--red)}
.days.ontime{color:var(--green)}.days.late{color:var(--amber)}.days.notsub{color:var(--red)}
.muted{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{border:1px solid var(--red-bg);border-left:5px solid var(--red);border-radius:12px;padding:12px;background:var(--card)}
.bar{height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--border);min-width:200px}
.bar span{display:block;height:100%}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
dialog{border:0;border-radius:16px;padding:22px;background:var(--card);color:var(--text);width:min(520px,94vw)}
dialog::backdrop{background:rgba(10,12,30,.5)}
dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .grid .full{grid-column:1/-1}
dialog input,dialog textarea{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2140;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.cloud{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2)}
.empty{text-align:center;padding:40px;color:var(--muted)}
/* View-only mode: hide every control that changes data */
body.viewer #addBtn,body.viewer #resetBtn,body.viewer #clearBtn,body.viewer #applyDue,body.viewer #importLabel,body.viewer [data-edit],body.viewer [data-del]{display:none !important}
body.viewer #hrImportLabel,body.viewer .hr-admin{display:none !important}
.hr-bk{background:#fff7ed;color:#c2410c;border-color:#fdba74}
[data-theme=dark] .hr-bk{background:#431407;color:#fdba74;border-color:#9a3412}
/* Homeroom section: eye-catching accents */
.chip.hr{background:linear-gradient(120deg,#0d9488,#14b8a6);color:#fff;border-color:transparent}
.chip.hr.on{background:linear-gradient(120deg,#f59e0b,#f97316);color:#fff}
.hr-name{background:none;border:0;padding:0;font:inherit;font-weight:700;color:#4130c8;cursor:pointer;text-align:left}
.hr-name:hover{text-decoration:underline}
.grade-pill{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:4px 10px;font-weight:700;color:#fff;background:linear-gradient(120deg,#f59e0b,#f97316)}
td.campus-row{background:linear-gradient(90deg,#ccfbf1,#f0fdfa);color:#0f766e;font-weight:700;font-size:15px}
[data-theme=dark] td.campus-row{background:linear-gradient(90deg,#134e4a,#1b1e3c);color:#5eead4}
#hrDlg{width:min(600px,96vw)}
.tt-wrap{overflow-x:auto;margin-top:12px}
table.tt{width:100%;border-collapse:collapse;font-size:14px}
table.tt th,table.tt td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
table.tt thead th{font-size:13px;font-weight:700;color:#334155;background:#f1f5f9}
[data-theme=dark] table.tt thead th{background:#1e293b;color:#cbd5e1}
table.tt tbody tr:last-child td{border-bottom:0}
.tt-day{display:inline-flex;align-items:center;gap:8px;background:#eff6ff;color:#1e3a8a;border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
[data-theme=dark] .tt-day{background:#1e293b;color:#bfdbfe}
.tt-select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit;font:inherit;font-size:14px}
[data-theme=dark] .tt-select{background:#0f172a;border-color:#334155;color:#e2e8f0}
table.tt td:last-child{width:100%}
.tt-select{min-width:0;max-width:100%}
.tt-hint{margin-top:6px;font-size:12px;line-height:1.5;color:#64748b}
[data-theme=dark] .tt-hint{color:#94a3b8}
.tt-actions{margin-top:14px;text-align:right}
.hr-edit label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
.hr-edit input{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit;font:inherit;font-size:15px}
[data-theme=dark] .hr-edit input{background:#0f172a;border-color:#334155}
.duty-pill{display:inline-block;padding:7px 11px;border-radius:12px;background:#f1f5f9;color:#64748b;font-weight:600;font-size:13px;white-space:nowrap}
.duty-pill.ok{background:#dcfce7;color:#15803d}
[data-theme=dark] .duty-pill{background:#1e293b;color:#94a3b8}
[data-theme=dark] .duty-pill.ok{background:#14532d;color:#bbf7d0}
.duty-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.duty-actions .btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.duty-del{color:#dc2626;border-color:#dc2626}
.q-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.q-label{font-size:13px;color:var(--muted);font-weight:600;align-self:center}
.q-cap{font-size:13px;color:var(--muted);font-weight:600;padding:5px 0}
.q-bk{margin-top:4px;align-self:flex-start;background:#fff7ed;color:#c2410c;border-color:#fdba74}
[data-theme=dark] .q-bk{background:#431407;color:#fdba74;border-color:#9a3412}
body.viewer .q-bk{display:none !important}
.q-item{display:flex;flex-direction:column;gap:5px}
.q-item input{padding:8px 10px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:14px;background:var(--card);color:inherit}
.view-banner{width:100%;padding:6px;margin-top:8px;justify-content:center;background:#4f46e5;border-radius:12px;overflow:hidden}
.view-banner img{display:block;width:100%;height:auto}
.gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:auto;background:radial-gradient(900px 520px at 0% -10%,#7c3aed 0%,transparent 60%),radial-gradient(800px 480px at 110% 110%,#0d9488 0%,transparent 55%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#1e3a5f)}
.gate-card{width:min(420px,94vw);background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:24px;padding:18px 22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center;animation:gateIn .35s ease both}
@keyframes gateIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.gate-top{display:flex;justify-content:flex-end}
.lang-seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg);border:1px solid var(--border)}
.lang-seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang-seg button.on{background:var(--primary);color:#fff}
.gate-logo{margin:4px auto 14px}
.gate-logo img{display:block;width:168px;height:168px;margin:0 auto;object-fit:contain;border-radius:32px;background:none;box-shadow:none}
.gate-title{margin:0;font-size:22px;font-weight:800}
.gate-sub{margin:6px 0 18px;color:var(--muted);font-size:14px}
.gate-field{position:relative;display:flex;align-items:center}
.gate-field>svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.gate-field input{width:100%;padding:13px 46px;border:2px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-size:18px;letter-spacing:3px;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s}
.gate-field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(81,69,224,.18)}
.gate-eye{position:absolute;right:8px;display:flex;padding:6px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.gate-err{min-height:20px;margin:8px 0 2px;color:var(--red);font-size:14px;font-weight:600}
.gate-submit{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#4f46e5,#7c3aed);box-shadow:0 10px 24px rgba(79,70,229,.35);cursor:pointer}
.gate-submit:hover{filter:brightness(1.06)}
.gate-or{display:flex;align-items:center;gap:10px;margin:18px 0 6px;color:var(--muted);font-size:13px}
.gate-or::before,.gate-or::after{content:"";flex:1;height:1px;background:var(--border)}
.gate-hint{margin:0;color:var(--muted);font-size:13px}
.gate-tile{width:100%;display:flex;align-items:center;gap:14px;margin-top:10px;padding:13px 14px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.gate-tile:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 12px 26px rgba(30,30,90,.14)}
.gate-ico{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.gate-ico.amber{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.gate-ico.green{background:linear-gradient(135deg,#10b981,#0d9488)}
.gate-txt b{display:block;font-size:14px;line-height:1.35}
.gate-txt small{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:500}
.duty-slot{display:inline-flex;align-items:center;gap:6px;background:#fef9c3;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap}
[data-theme=dark] .duty-slot{background:#422006;border-color:#a16207;color:#fde68a}
table.hr-duty td{vertical-align:middle}
table.hr-duty thead th{white-space:nowrap}
.hr-stack{display:flex;flex-direction:column;align-items:flex-start;gap:3px;color:inherit;font:inherit}
.hr-stack .hr-km{font-weight:700;font-size:15px}
.hr-stack .hr-en{font-size:12px;font-weight:600;color:#64748b;letter-spacing:.02em}
.hr-stack:hover .hr-en{text-decoration:underline}
.class-pill{display:inline-block;min-width:52px;text-align:center;padding:7px 12px;border-radius:10px;background:#e0e7ff;color:#3730a3;font-weight:700}
[data-theme=dark] .class-pill{background:#312e81;color:#c7d2fe}
/* Teacher table scrolls inside its own box; the column headings stay on top */
.hr-scroll{max-height:max(260px,calc(100vh - 300px));overflow:auto;border-radius:12px}
table.hr-duty thead th{position:sticky;top:0;z-index:2;background:#f1f5f9;box-shadow:0 1px 0 var(--border)}
[data-theme=dark] table.hr-duty thead th{background:#1e293b}
/* Teacher tracker table: header row stays visible while the list scrolls */
.tbl-scroll{max-height:max(260px,calc(100vh - 300px))}
.tbl-scroll thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--border)}
.hr-stats{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
.hr-stat{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:#fff;color:#334155;font-size:14px}
.hr-stat b{font-size:16px}
.hr-stat.ok{background:#f0fdf4;border-color:#86efac;color:#166534}
.hr-stat.pending{color:#64748b}
[data-theme=dark] .hr-stat{background:#0f172a;color:#cbd5e1}
[data-theme=dark] .hr-stat.ok{background:#052e16;border-color:#166534;color:#bbf7d0}
.hr-line{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.hr-line:last-child{border-bottom:0}
.hr-label{color:var(--muted);font-size:14px}
.hr-val{font-weight:600;text-align:right}
.hr-val.big{font-size:17px;color:#4130c8}
[data-theme=dark] .hr-val.big{color:#c3bfff}
@media (max-width:640px){dialog .grid{grid-template-columns:1fr}}
</style>
</head>
<body class="km">
<div class="wrap">

<header>
  <div style="display:flex;align-items:center;gap:14px">
    <img src="logo.png" alt="Western International School" style="height:64px;width:auto;border-radius:12px;flex:0 0 auto" />
    <div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="actions">
    <span class="cloud" id="cloud"></span>
    <button class="btn" id="langBtn"></button>
    <button class="btn gold" id="refreshBtn" data-i18n="refresh"></button>
    <button class="btn green" id="exportBtn" data-i18n="export"></button>
    <button class="btn ghost" id="signOutBtn" data-i18n="signOut"></button>
    <button class="btn dark" id="themeBtn">🌙</button>
  </div>
</header>

<section class="card" style="margin-top:16px">
  <div class="q-row" id="qRow">
    <span class="q-label" data-i18n="qRowLbl"></span>
    <div class="q-item"><button class="btn ghost sm" type="button" data-q="1" data-i18n="qLabel1"></button><input type="date" id="qDate1" data-qd="1" /><button class="btn ghost sm q-bk" type="button" data-qb="1" data-i18n="bkBtn"></button></div>
    <div class="q-item"><button class="btn ghost sm" type="button" data-q="2" data-i18n="qLabel2"></button><input type="date" id="qDate2" data-qd="2" /><button class="btn ghost sm q-bk" type="button" data-qb="2" data-i18n="bkBtn"></button></div>
    <div class="q-item"><button class="btn ghost sm" type="button" data-q="3" data-i18n="qLabel3"></button><input type="date" id="qDate3" data-qd="3" /><button class="btn ghost sm q-bk" type="button" data-qb="3" data-i18n="bkBtn"></button></div>
    <div class="q-item"><button class="btn ghost sm" type="button" data-q="4" data-i18n="qLabel4"></button><input type="date" id="qDate4" data-qd="4" /><button class="btn ghost sm q-bk" type="button" data-qb="4" data-i18n="bkBtn"></button></div>
    <div class="q-item"><span class="q-cap" data-i18n="calcLabel"></span><input type="date" id="calcDate" disabled title="ថ្ងៃនេះតាមម៉ាស៊ីន / Today from this computer" /></div>
  </div>
  <div class="toolbar" style="margin:0">
    <div class="actions">
    </div>
    <div class="actions">
      <label class="btn primary" id="importLabel" style="cursor:pointer"><input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden /><span data-i18n="importBtn"></span></label>
      <button class="btn primary" id="addBtn" data-i18n="addBtn"></button>
      <button class="btn danger" id="resetBtn" data-i18n="resetBtn"></button>
      <button class="btn danger" id="clearBtn" data-i18n="clearBtn"></button>
    </div>
  </div>
</section>

<section class="stats" id="stats">
  <div class="card stat"><div class="lbl" data-i18n="total"></div><div class="num" id="sTotal">0</div><div class="lbl" id="sPct"></div></div>
  <div class="card stat g"><div class="lbl" data-i18n="onTime"></div><div class="num" id="sOn">0</div><div class="lbl" data-i18n="onTimeHint"></div></div>
  <div class="card stat a"><div class="lbl" data-i18n="late"></div><div class="num" id="sLate">0</div><div class="lbl" id="sLateAvg"></div></div>
  <div class="card stat r"><div class="lbl" data-i18n="notSub"></div><div class="num" id="sNot">0</div><div class="lbl" id="sNotHint"></div></div>
</section>

<section class="card">
  <div class="toolbar">
    <div class="chips" id="filterBar">
      <button class="chip" data-filter="all"><span data-i18n="fAll"></span> <b class="cnt"></b></button>
      <button class="chip" data-filter="ontime"><span data-i18n="fOn"></span> <b class="cnt"></b></button>
      <button class="chip" data-filter="late"><span data-i18n="fLate"></span> <b class="cnt"></b></button>
      <button class="chip" data-filter="notsub"><span data-i18n="fNot"></span> <b class="cnt"></b></button>
    </div>
    <div class="chips">
      <button class="chip" data-view="table" data-i18n="vTable"></button>
      <button class="chip" data-view="board" data-i18n="vBoard"></button>
      <button class="chip" data-view="charts" data-i18n="vCharts"></button>
      <button class="chip hr" data-view="homeroom" data-i18n="vHome"></button>
    </div>
  </div>
  <div class="toolbar" style="margin-top:0">
    <input type="search" id="search" style="flex:1;min-width:220px" />
    <select id="sort">
      <option value="name" data-i18n="sortName"></option>
      <option value="subject" data-i18n="sortSub"></option>
      <option value="status" data-i18n="sortStatus"></option>
      <option value="days" data-i18n="sortDays"></option>
    </select>
  </div>
  <div id="hrBar" class="toolbar" style="display:none;margin-top:0">
    <div class="actions">
      <select id="hrSem"></select>
      <button class="btn ghost sm hr-bk hr-admin" type="button" id="hrBk"></button>
      <button class="btn ghost sm hr-admin" type="button" id="hrMk"></button>
    </div>
    <div class="actions">
      <label class="btn primary" id="hrImportLabel" style="cursor:pointer"><input type="file" id="hrFile" accept=".xls,.xlsx" hidden /><span data-i18n="hrImport"></span></label>
    </div>
  </div>
  <div id="content"></div>

<dialog id="hrDlg">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <h3 id="hrDlgTitle" style="margin:0"></h3>
    <button class="btn ghost sm" type="button" id="hrDlgClose">✕</button>
  </div>
  <div id="hrDlgBody"></div>
</dialog>
</section>

</div>

<dialog id="dlg">
  <form id="teacherForm">
    <h3 id="dlgTitle" style="margin-top:0"></h3>
    <div class="grid">
      <div class="field full"><label data-i18n="nameEn"></label><input name="name_en" required /></div>
      <div class="field full"><label data-i18n="nameKm"></label><input name="name_km" /></div>
      <div class="field"><label data-i18n="subject"></label><input name="subject" /></div>
      <div class="field"><label data-i18n="classes"></label><input name="classes" /></div>
      <div class="field"><label data-i18n="dueOwn"></label><input type="date" name="due_date" /></div>
      <div class="field"><label data-i18n="submittedCol"></label><input type="date" name="submitted_date" /></div>
      <div class="field full"><label data-i18n="remark"></label><textarea name="remark" rows="2"></textarea></div>
    </div>
    <div class="actions" style="justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" id="cancelBtn" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-top">
      <div class="lang-seg" role="group" aria-label="Language / ភាសា">
        <button type="button" data-gate-lang="km">ខ្មែរ</button>
        <button type="button" data-gate-lang="en">English</button>
      </div>
    </div>
    <div class="gate-logo"><img src="logo.png" alt="" /></div>
    <h2 class="gate-title"><span data-i18n="gateTitle"></span></h2>
    <p class="gate-sub" data-i18n="gateSub"></p>
    <form id="gateForm" autocomplete="off">
      <div class="gate-field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        <input type="password" id="gatePass" data-i18n-ph="gatePh" autocomplete="current-password" required />
        <button type="button" class="gate-eye" id="gateEye" data-i18n-title="gateShow" aria-label="show">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p id="gateErr" class="gate-err" role="alert"></p>
      <button class="gate-submit" type="submit" data-i18n="gateEnter"></button>
    </form>
    <div class="gate-or"><span data-i18n="gateOr"></span></div>
    <p class="gate-hint" data-i18n="gateViewHint"></p>
    <button class="gate-tile" type="button" id="viewTrackBtn" data-view-only="table">
      <span class="gate-ico amber"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h9"/></svg></span>
      <span class="gate-txt"><b data-i18n="tileTrackT"></b><small data-i18n="tileTrackS"></small></span>
    </button>
    <button class="gate-tile" type="button" id="viewHrBtn" data-view-only="homeroom">
      <span class="gate-ico green"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M21.5 20a6.5 6.5 0 00-4-6"/></svg></span>
      <span class="gate-txt"><b data-i18n="tileHrT"></b><small data-i18n="tileHrS"></small></span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="timesheet.js"></script>
<script src="homeroom.js"></script>
<script src="timetable.js"></script>
<script src="app.js"></script>
